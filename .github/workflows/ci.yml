name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    container: python:3.8.3-slim-buster
    steps:
      - uses: actions/checkout@v2
      - run: pip install -r requirements-dev.txt
      - run: flake8 ledgerline tests migrations *.py
      - run: black --check ledgerline tests migrations *.py
      - run: isort --check-only ledgerline tests migrations *.py

  test-sqlite:
    runs-on: ubuntu-latest
    container: python:3.8.3-slim-buster
    steps:
      - uses: actions/checkout@v2
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest --cov=ledgerline --cov-report=term tests

  test-postgres:
    runs-on: ubuntu-latest
    container: python:3.8.3-slim-buster
    services:
      postgres:
        image: postgres:12.3
        env:
          POSTGRES_USER: ledgerline
          POSTGRES_PASSWORD: ledgerline
          POSTGRES_DB: ledgerline_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://ledgerline:ledgerline@postgres:5432/ledgerline_test
    steps:
      - uses: actions/checkout@v2
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests
