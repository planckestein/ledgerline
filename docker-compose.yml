version: "3.8"

x-app: &app
  build: .
  environment:
    DATABASE_URL: postgresql://ledgerline:ledgerline@postgres:5432/ledgerline
    TEST_DATABASE_URL: postgresql://ledgerline:ledgerline@postgres:5432/ledgerline_test
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    SECRET_KEY: change-me
  depends_on:
    - postgres
    - redis

services:
  postgres:
    image: postgres:12.4
    environment:
      POSTGRES_USER: ledgerline
      POSTGRES_PASSWORD: ledgerline
      POSTGRES_DB: ledgerline
    volumes:
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"

  redis:
    image: redis:6.0.9
    ports:
      - "6379:6379"

  web:
    <<: *app
    command: sh -c "flask db upgrade && gunicorn --bind 0.0.0.0:8000 --workers 3 wsgi:app"
    ports:
      - "8000:8000"

  worker:
    <<: *app
    command: celery -A celery_worker.celery worker -B -l info

  tests:
    <<: *app
    environment:
      LEDGERLINE_CONFIG: testing
      TEST_DATABASE_URL: postgresql://ledgerline:ledgerline@postgres:5432/ledgerline_test
    command: python -m pytest tests
