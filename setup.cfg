[metadata]
name = ledgerline
description = Multi-tenant subscription billing service
license = Proprietary

[tool:pytest]
testpaths = tests
addopts = -p no:cacheprovider -q
filterwarnings =
    error::sqlalchemy.exc.SAWarning
    ignore:Dialect sqlite\+pysqlite does \*not\* support Decimal objects natively:sqlalchemy.exc.SAWarning
    ignore::DeprecationWarning:celery.*
    ignore::DeprecationWarning:kombu.*

[flake8]
max-line-length = 100
extend-ignore = E203, W503
exclude = .git,.venv,__pycache__,build,dist

[isort]
profile = black
line_length = 100
known_first_party = ledgerline,tests

[coverage:run]
source = ledgerline
branch = True

[coverage:report]
show_missing = True
skip_covered = True
